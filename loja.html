<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arsenal - PokéElite Canela PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           VARIÁVEIS TÁTICAS (MOBILE-FIRST)
           ========================================================= */
        :root {
            --bg-color-deep: #05051a;
            --bg-color-item: #1a1a4a;
            --text-color: #f1f1f1;
            --accent-color: #d4af37;
            --action-color: #25D366;
            --hover-color: #128C7E;
            --font-main: 'Montserrat', sans-serif;
            --border-radius: 12px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color-deep);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            /* Espaçamento normal, sem reservas para menus fixos */
            padding-bottom: 60px;
        }

        .container {
            width: 90%;
            max-width: 600px; /* Foco estreito para centralizar bem no desktop e preencher no mobile */
            margin: 0 auto;
            padding: 20px 0;
        }

        /* HEADER */
        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-bottom: 30px;
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--accent-color); text-transform: uppercase; }
        .logo span { color: white; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-top: 5px; }

        /* GRID DE PRODUTOS - 1 Coluna no Mobile */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .product-card {
            background-color: var(--bg-color-item);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .product-card:active {
            border-color: var(--accent-color);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            padding: 10px;
        }

        .product-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 1.5rem;
            color: var(--accent-color);
            font-weight: 900;
            margin-bottom: 20px;
        }

        /* CONTROLES DE QUANTIDADE */
        .qty-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 10px;
            max-width: 200px;
            margin: 0 auto;
        }

        .qty-btn {
            background: var(--bg-color-deep);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .qty-btn:active { 
            background: var(--accent-color); 
            color: var(--bg-color-deep);
            transform: scale(0.9); 
        }
        
        .qty-display {
            font-size: 1.5rem;
            font-weight: 700;
            min-width: 30px;
        }

        /* ZONA DE CONVERSÃO (ESTÁTICA, NO FINAL DA PÁGINA) */
        .checkout-section {
            margin-top: 40px;
            background-color: #0a0a2a;
            border: 2px solid var(--accent-color);
            border-radius: var(--border-radius);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .checkout-total {
            font-size: 1.5rem;
            color: white;
            font-weight: 900;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 15px;
        }

        .btn-checkout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            background-color: var(--action-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-checkout:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }

        .btn-checkout:active:not(:disabled) {
            transform: scale(0.98);
            background-color: var(--hover-color);
        }

        /* RESPONSIVIDADE DESKTOP (Caso alguém abra no PC, fica em grid) */
        @media (min-width: 768px) {
            .container { max-width: 1000px; }
            .products-grid { grid-template-columns: repeat(3, 1fr); }
            .checkout-section { max-width: 500px; margin: 40px auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PokéElite<span>Canela</span>PRO</div>
        <div class="subtitle">Selecione as quantidades abaixo</div>
    </header>

    <div class="container">
        
        <!-- FLUXO NATURAL DE PRODUTOS -->
        <div class="products-grid">
            
            <div class="product-card">
                <img src="1000204683.jpg" alt="Lure Module" class="product-img">
                <div class="product-title">Lure Module</div>
                <div class="product-price">R$ 0,90</div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="updateQty('lure', -1)">-</button>
                    <span class="qty-display" id="qty-lure">0</span>
                    <button class="qty-btn" onclick="updateQty('lure', 1)">+</button>
                </div>
            </div>

            <div class="product-card">
                <img src="1000204681.jpg" alt="Incense" class="product-img">
                <div class="product-title">Incenso</div>
                <div class="product-price">R$ 0,40</div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="updateQty('incense', -1)">-</button>
                    <span class="qty-display" id="qty-incense">0</span>
                    <button class="qty-btn" onclick="updateQty('incense', 1)">+</button>
                </div>
            </div>

            <div class="product-card">
                <img src="1000204679.jpg" alt="Lucky Egg" class="product-img">
                <div class="product-title">Lucky Egg (Ovo)</div>
                <div class="product-price">R$ 0,70</div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="updateQty('luckyegg', -1)">-</button>
                    <span class="qty-display" id="qty-luckyegg">0</span>
                    <button class="qty-btn" onclick="updateQty('luckyegg', 1)">+</button>
                </div>
            </div>

        </div>

        <!-- ZONA DE COMPRA ESTÁTICA AO FINAL DA LISTA -->
        <div class="checkout-section">
            <div class="checkout-total">
                <span>TOTAL:</span>
                <span id="visor-total">R$ 0,00</span>
            </div>
            
            <button id="checkout-btn" class="btn-checkout" onclick="enviarParaWhatsApp()" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                Comprar via WhatsApp
            </button>
        </div>

    </div>

    <!-- MOTOR LÓGICO INTACTO -->
    <script>
        const inventario = {
            lure: { nome: "Lure Module", preco: 0.90, qtd: 0 },
            incense: { nome: "Incenso", preco: 0.40, qtd: 0 },
            luckyegg: { nome: "Lucky Egg", preco: 0.70, qtd: 0 }
        };

        const NUMERO_WHATSAPP = "5541996420192";

        function updateQty(item, modificador) {
            let novaQtd = inventario[item].qtd + modificador;
            if (novaQtd < 0) novaQtd = 0;
            
            inventario[item].qtd = novaQtd;
            document.getElementById(`qty-${item}`).innerText = inventario[item].qtd;
            
            calcularTotal();
        }

        function calcularTotal() {
            const visorTotal = document.getElementById('visor-total');
            const btnCheckout = document.getElementById('checkout-btn');
            
            let totalPedido = 0;
            let itensNoCarrinho = 0;

            for (const [chave, dados] of Object.entries(inventario)) {
                if (dados.qtd > 0) {
                    totalPedido += (dados.qtd * dados.preco);
                    itensNoCarrinho++;
                }
            }

            visorTotal.innerText = `R$ ${totalPedido.toFixed(2).replace('.', ',')}`;

            // Habilita o botão apenas se houver itens selecionados
            if (itensNoCarrinho === 0) {
                btnCheckout.disabled = true;
            } else {
                btnCheckout.disabled = false;
            }
        }

        function enviarParaWhatsApp() {
            let total = 0;
            let mensagem = "*NOVO PEDIDO - POKÉELITE CANELA PRO*%0A%0A";
            mensagem += "Itens selecionados:%0A";

            for (const [chave, dados] of Object.entries(inventario)) {
                if (dados.qtd > 0) {
                    const subtotal = dados.qtd * dados.preco;
                    total += subtotal;
                    mensagem += `- ${dados.qtd}x ${dados.nome} (R$ ${subtotal.toFixed(2).replace('.', ',')})%0A`;
                }
            }

            mensagem += `%0A*TOTAL: R$ ${total.toFixed(2).replace('.', ',')}*%0A%0A`;
            mensagem += "Aguardo as instruções para o pagamento.";

            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensagem}`;
            window.location.href = url; // Roteia na mesma aba diretamente para o App do Whatsapp
        }
    </script>
</body>
</html>
