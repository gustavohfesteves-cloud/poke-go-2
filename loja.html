<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal - PokéElite Canela PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           VARIÁVEIS TÁTICAS (MANTENDO COESÃO COM A HOME)
           ========================================================= */
        :root {
            --bg-color-deep: #05051a;
            --bg-color-cards: #101030;
            --bg-color-item: #1a1a4a;
            --text-color: #f1f1f1;
            --accent-color: #d4af37;
            --action-color: #25D366; /* Verde WhatsApp */
            --hover-color: #128C7E;
            --font-main: 'Montserrat', sans-serif;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color-deep);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 0;
        }

        /* HEADER */
        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-bottom: 40px;
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--accent-color); }
        .logo span { color: white; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-top: 5px; }

        /* GRID DA LOJA E CARRINHO */
        .shop-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            align-items: start;
        }

        /* PRODUTOS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: var(--bg-color-item);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: var(--border-radius);
            padding: 25px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            padding: 10px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 1.4rem;
            color: var(--accent-color);
            font-weight: 900;
            margin-bottom: 20px;
        }

        /* CONTROLES DE QUANTIDADE */
        .qty-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 5px;
        }

        .qty-btn {
            background: var(--bg-color-cards);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .qty-btn:hover { background: var(--accent-color); color: var(--bg-color-deep); }
        .qty-btn:active { transform: scale(0.9); }
        
        .qty-display {
            font-size: 1.2rem;
            font-weight: 700;
            min-width: 30px;
        }

        /* CARRINHO TÁTICO (LATERAL) */
        .cart-panel {
            background-color: var(--bg-color-cards);
            padding: 30px;
            border-radius: var(--border-radius);
            border: 2px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 20px;
        }

        .cart-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .cart-items { margin-bottom: 25px; min-height: 100px; }
        
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.8);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 900;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed rgba(255,255,255,0.2);
            color: white;
        }

        .btn-checkout {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: var(--action-color);
            color: white;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-checkout:hover {
            background-color: var(--hover-color);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
            transform: translateY(-2px);
        }

        .btn-checkout:disabled {
            background-color: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .empty-msg {
            color: rgba(255,255,255,0.4);
            text-align: center;
            font-style: italic;
            margin-top: 20px;
        }

       /* RESPONSIVIDADE TÁTICA CORRIGIDA */
        @media (max-width: 900px) {
            .shop-layout { 
                grid-template-columns: 1fr; 
            }
            
            /* Transforma o painel num rodapé fixo compacto e agressivo */
            .cart-panel { 
                position: fixed; 
                bottom: 0; 
                left: 0; 
                width: 100%; 
                border-radius: 15px 15px 0 0; 
                z-index: 1000; 
                box-shadow: 0 -15px 30px rgba(0,0,0,0.85); 
                padding: 15px 20px; 
                background-color: var(--bg-color-cards);
                border-top: 2px solid var(--accent-color);
            }
            
            /* Oculta distrações para focar na conversão */
            .cart-title { display: none; }
            .cart-items { display: none; }
            
            /* Compacta os valores */
            .cart-total { 
                margin-top: 0; 
                padding-top: 0; 
                border: none; 
                font-size: 1.3rem; 
                margin-bottom: 10px;
            }
            
            .btn-checkout { 
                margin-top: 0; 
                padding: 12px; 
                font-size: 1rem; 
            }
            
            /* Garante área livre para rolagem não esconder o último item */
            body { 
                padding-bottom: 130px; 
            } 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PokéElite<span>Canela</span>PRO</div>
        <div class="subtitle">Arsenal de Suprimentos - Abasteça sua conta com descontos massivos</div>
    </header>

    <div class="container">
        <div class="shop-layout">
            
            <!-- GRID DE PRODUTOS -->
            <div class="products-grid">
                
                <!-- PRODUTO 1: LURE -->
                <div class="product-card">
                    <img src="1000204683.jpg" alt="Lure Module" class="product-img">
                    <div class="product-title">Lure Module</div>
                    <div class="product-price">R$ 0,90</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('lure', -1)">-</button>
                        <span class="qty-display" id="qty-lure">0</span>
                        <button class="qty-btn" onclick="updateQty('lure', 1)">+</button>
                    </div>
                </div>

                <!-- PRODUTO 2: INCENSO -->
                <div class="product-card">
                    <img src="1000204681.jpg" alt="Incense" class="product-img">
                    <div class="product-title">Incenso</div>
                    <div class="product-price">R$ 0,40</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('incense', -1)">-</button>
                        <span class="qty-display" id="qty-incense">0</span>
                        <button class="qty-btn" onclick="updateQty('incense', 1)">+</button>
                    </div>
                </div>

                <!-- PRODUTO 3: LUCKY EGG -->
                <div class="product-card">
                    <img src="1000204679.jpg" alt="Lucky Egg" class="product-img">
                    <div class="product-title">Lucky Egg (Ovo)</div>
                    <div class="product-price">R$ 0,70</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('luckyegg', -1)">-</button>
                        <span class="qty-display" id="qty-luckyegg">0</span>
                        <button class="qty-btn" onclick="updateQty('luckyegg', 1)">+</button>
                    </div>
                </div>

            </div>

            <!-- PAINEL DO CARRINHO TÁTICO -->
            <div class="cart-panel">
                <h3 class="cart-title">Suprimentos Selecionados</h3>
                <div class="cart-items" id="cart-items">
                    <div class="empty-msg">Seu arsenal está vazio.</div>
                </div>
                
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-value">R$ 0,00</span>
                </div>

                <button id="checkout-btn" class="btn-checkout" onclick="enviarParaWhatsApp()" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Comprar via WhatsApp
                </button>
            </div>

        </div>
    </div>

    <!-- MOTOR LÓGICO DE CÁLCULO E ROTEAMENTO -->
    <script>
        // Banco de dados de estado tático
        const inventario = {
            lure: { nome: "Lure Module", preco: 0.90, qtd: 0 },
            incense: { nome: "Incenso", preco: 0.40, qtd: 0 },
            luckyegg: { nome: "Lucky Egg", preco: 0.70, qtd: 0 }
        };

        const NUMERO_WHATSAPP = "5541996420192";

        // Atualiza quantidades
        function updateQty(item, modificador) {
            let novaQtd = inventario[item].qtd + modificador;
            if (novaQtd < 0) novaQtd = 0; // Proteção contra números negativos
            
            inventario[item].qtd = novaQtd;
            
            // Atualiza display na UI do produto
            document.getElementById(`qty-${item}`).innerText = inventario[item].qtd;
            
            renderizarCarrinho();
        }

        // Renderiza o visor do carrinho e calcula o total
        function renderizarCarrinho() {
            const painelItens = document.getElementById('cart-items');
            const visorTotal = document.getElementById('cart-total-value');
            const btnCheckout = document.getElementById('checkout-btn');
            
            let htmlCarrinho = '';
            let totalPedido = 0;
            let itensNoCarrinho = 0;

            for (const [chave, dados] of Object.entries(inventario)) {
                if (dados.qtd > 0) {
                    const subtotal = dados.qtd * dados.preco;
                    totalPedido += subtotal;
                    itensNoCarrinho++;
                    
                    htmlCarrinho += `
                        <div class="cart-item-row">
                            <span>${dados.qtd}x ${dados.nome}</span>
                            <span>R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                }
            }

            // Atualiza UI
            if (itensNoCarrinho === 0) {
                painelItens.innerHTML = '<div class="empty-msg">Seu arsenal está vazio.</div>';
                btnCheckout.disabled = true;
            } else {
                painelItens.innerHTML = htmlCarrinho;
                btnCheckout.disabled = false;
            }

            visorTotal.innerText = `R$ ${totalPedido.toFixed(2).replace('.', ',')}`;
        }

        // Gera a rota de ataque (Link WhatsApp)
        function enviarParaWhatsApp() {
            let total = 0;
            let mensagem = "*NOVO PEDIDO - POKÉELITE CANELA PRO*%0A%0A";
            mensagem += "Itens selecionados:%0A";

            for (const [chave, dados] of Object.entries(inventario)) {
                if (dados.qtd > 0) {
                    const subtotal = dados.qtd * dados.preco;
                    total += subtotal;
                    mensagem += `- ${dados.qtd}x ${dados.nome} (R$ ${subtotal.toFixed(2).replace('.', ',')})%0A`;
                }
            }

            mensagem += `%0A*TOTAL: R$ ${total.toFixed(2).replace('.', ',')}*%0A%0A`;
            mensagem += "Aguardo as instruções para o pagamento.";

            // Dispara URL para a API do WhatsApp
            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensagem}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
