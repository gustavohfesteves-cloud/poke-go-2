<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arsenal - PokéElite Canela PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           VARIÁVEIS GLOBAIS E RESET
           ========================================================= */
        :root {
            --bg-color-deep: #05051a;
            --bg-color-cards: #101030;
            --bg-color-item: #1a1a4a;
            --text-color: #f1f1f1;
            --accent-color: #d4af37;
            --action-color: #25D366;
            --hover-color: #128C7E;
            --font-main: 'Montserrat', sans-serif;
            --border-radius: 12px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color-deep);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 0;
        }

        /* HEADER */
        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-bottom: 30px;
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--accent-color); }
        .logo span { color: white; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-top: 5px; }

        /* GRID PRINCIPAL (DESKTOP) */
        .shop-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            align-items: start;
        }

        /* PRODUTOS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--bg-color-item);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .product-img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            padding: 10px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 1.3rem;
            color: var(--accent-color);
            font-weight: 900;
            margin-bottom: 15px;
        }

        /* CONTROLES DE QUANTIDADE */
        .qty-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 8px;
        }

        .qty-btn {
            background: var(--bg-color-cards);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover { background: var(--accent-color); color: var(--bg-color-deep); }
        .qty-btn:active { transform: scale(0.9); }
        
        .qty-display {
            font-size: 1.2rem;
            font-weight: 700;
            min-width: 30px;
        }

        /* CARRINHO (DESKTOP) */
        .cart-panel {
            background-color: var(--bg-color-cards);
            padding: 30px;
            border-radius: var(--border-radius);
            border: 2px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 20px;
        }

        .cart-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            font-weight: 900;
        }

        .cart-items { 
            margin-bottom: 20px; 
            min-height: 80px; 
        }
        
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.8);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.4rem;
            font-weight: 900;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255,255,255,0.2);
            color: white;
        }

        .btn-checkout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background-color: var(--action-color);
            color: white;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-checkout:hover {
            background-color: var(--hover-color);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }

        .btn-checkout:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .empty-msg {
            color: rgba(255,255,255,0.4);
            text-align: center;
            font-style: italic;
            margin-top: 20px;
        }

        /* =========================================================
           REESTRUTURAÇÃO TÁTICA MOBILE (RESOLUÇÃO DO BUG)
           ========================================================= */
        @media (max-width: 900px) {
            /* Garante que o usuário possa rolar até o final sem a barra sobrepor os itens */
            body { 
                padding-bottom: 140px; 
            }

            .shop-layout { 
                display: block; /* Remove o grid no mobile */
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            /* Transforma o painel lateral numa barra inferior fixa e enxuta */
            .cart-panel { 
                position: fixed; 
                bottom: 0; 
                left: 0; 
                width: 100%; 
                border-radius: 16px 16px 0 0; 
                z-index: 9999; 
                padding: 15px 20px; 
                background-color: var(--bg-color-cards);
                border: none;
                border-top: 2px solid var(--accent-color);
                box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
                /* Flexbox para alinhar total e botão lado a lado */
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            
            /* Oculta elementos que poluem a tela no mobile */
            .cart-title { display: none; }
            .cart-items { display: none; }
            
            /* Compacta o visor de total */
            .cart-total { 
                margin: 0; 
                padding: 0; 
                border: none; 
                font-size: 1.2rem; 
            }
            
            /* Reduz o botão para encaixar na barra inferior */
            .btn-checkout { 
                margin: 0; 
                padding: 14px; 
                font-size: 0.95rem; 
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PokéElite<span>Canela</span>PRO</div>
        <div class="subtitle">Arsenal de Suprimentos - Abasteça sua conta com descontos massivos</div>
    </header>

    <div class="container">
        <div class="shop-layout">
            
            <!-- GRID DE PRODUTOS -->
            <div class="products-grid">
                
                <div class="product-card">
                    <img src="1000204683.jpg" alt="Lure Module" class="product-img">
                    <div class="product-title">Lure Module</div>
                    <div class="product-price">R$ 0,90</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('lure', -1)">-</button>
                        <span class="qty-display" id="qty-lure">0</span>
                        <button class="qty-btn" onclick="updateQty('lure', 1)">+</button>
                    </div>
                </div>

                <div class="product-card">
                    <img src="1000204681.jpg" alt="Incense" class="product-img">
                    <div class="product-title">Incenso</div>
                    <div class="product-price">R$ 0,40</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('incense', -1)">-</button>
                        <span class="qty-display" id="qty-incense">0</span>
                        <button class="qty-btn" onclick="updateQty('incense', 1)">+</button>
                    </div>
                </div>

                <div class="product-card">
                    <img src="1000204679.jpg" alt="Lucky Egg" class="product-img">
                    <div class="product-title">Lucky Egg (Ovo)</div>
                    <div class="product-price">R$ 0,70</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('luckyegg', -1)">-</button>
                        <span class="qty-display" id="qty-luckyegg">0</span>
                        <button class="qty-btn" onclick="updateQty('luckyegg', 1)">+</button>
                    </div>
                </div>

            </div>

            <!-- PAINEL DO CARRINHO (LATERAL NO DESKTOP / BARRA INFERIOR NO MOBILE) -->
            <div class="cart-panel">
                <h3 class="cart-title">Suprimentos</h3>
                <div class="cart-items" id="cart-items">
                    <div class="empty-msg">Seu arsenal está vazio.</div>
                </div>
                
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-value">R$ 0,00</span>
                </div>

                <button id="checkout-btn" class="btn-checkout" onclick="enviarParaWhatsApp()" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Comprar via WhatsApp
                </button>
            </div>

        </div>
    </div>

    <!-- MOTOR LÓGICO -->
    <script>
        const inventario = {
            lure: { nome: "Lure Module", preco: 0.90, qtd: 0 },
            incense: { nome: "Incenso", preco: 0.40, qtd: 0 },
            luckyegg: { nome: "Lucky Egg", preco: 0.70, qtd: 0 }
        };

        const NUMERO_WHATSAPP = "5541996420192";

        function updateQty(item, modificador) {
            let novaQtd = inventario[item].qtd + modificador;
            if (novaQtd < 0) novaQtd = 0;
            
            inventario[item].qtd = novaQtd;
            document.getElementById(`qty-${item}`).innerText = inventario[item].qtd;
            
            renderizarCarrinho();
        }

        function renderizarCarrinho() {
            const painelItens = document.getElementById('cart-items');
            const visorTotal = document.getElementById('cart-total-value');
            const btnCheckout = document.getElementById('checkout-btn');
            
            let htmlCarrinho = '';
            let totalPedido = 0;
            let itensNoCarrinho = 0;

            for (const [chave, dados] of Object.entries(inventario)) {
                if (dados.qtd > 0) {
                    const subtotal = dados.qtd * dados.preco;
                    totalPedido += subtotal;
                    itensNoCarrinho++;
                    
                    htmlCarrinho += `
                        <div class="cart-item-row">
                            <span>${dados.qtd}x ${dados.nome}</span>
                            <span>R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                }
            }

            if (itensNoCarrinho === 0) {
                painelItens.innerHTML = '<div class="empty-msg">Seu arsenal está vazio.</div>';
                btnCheckout.disabled = true;
            } else {
                painelItens.innerHTML = htmlCarrinho;
                btnCheckout.disabled = false;
            }

            visorTotal.innerText = `R$ ${totalPedido.toFixed(2).replace('.', ',')}`;
        }

        function enviarParaWhatsApp() {
            let total = 0;
            let mensagem = "*NOVO PEDIDO - POKÉELITE CANELA PRO*%0A%0A";
            mensagem += "Itens selecionados:%0A";

            for (const [chave, dados] of Object.entries(inventario)) {
                if (dados.qtd > 0) {
                    const subtotal = dados.qtd * dados.preco;
                    total += subtotal;
                    mensagem += `- ${dados.qtd}x ${dados.nome} (R$ ${subtotal.toFixed(2).replace('.', ',')})%0A`;
                }
            }

            mensagem += `%0A*TOTAL: R$ ${total.toFixed(2).replace('.', ',')}*%0A%0A`;
            mensagem += "Aguardo as instruções para o pagamento.";

            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensagem}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
